# Rastreo diario de campaña (`npm run rastreo`): fuentes que se leen y nombres que cuentan como
# «dentro del alcance». Lo que sale en la bandeja son pistas, no fuentes (skill /bandeja).

# Verificadores: todo lo que publican pasa por el filtro de nombres.
verificadores:
  - { nombre: Newtral, url: https://www.newtral.es/feed/ }
  - { nombre: Maldita, url: https://maldita.es/feed/ }
  - { nombre: EFE Verifica, url: https://verifica.efe.com/feed/ }
  - { nombre: Verificat, url: https://www.verificat.cat/feed/ }

# La Moncloa: fuente primaria y todo dentro del alcance (sin filtro de nombres).
moncloa:
  - { nombre: Consejo de Ministros, url: "https://www.lamoncloa.gob.es/Paginas/rss.aspx?tipo=15" }
  - { nombre: Presidente, url: "https://www.lamoncloa.gob.es/Paginas/rss.aspx?tipo=20" }

# Canales oficiales de YouTube de los partidos (id «UC…»): mítines y entrevistas completos.
# Pendientes, sin canal oficial activo localizado (19-11-2026): Podemos y Frente Amplio.
youtube:
  - { nombre: PSOE, canal: UCB75fTm3weGTmtnitiZcdBw }
  - { nombre: PSC, canal: UCTv0iLn3S2Pg7iLKWaVpXWg }
  - { nombre: Sumar, canal: UCEg-oyYjgbOL0NG5qjtuRFA }       # sin vídeos desde el 17-10-2026
  - { nombre: ERC, canal: UCjVuuV1sd8GnZj_7tq1R0bA }         # último vídeo: 20-05-2026
  - { nombre: Junts, canal: UCG6dZxszooC9hpNRr1-LlJw }
  - { nombre: EH Bildu, canal: UCbL7d4Gubav2tnardHApS7Q }
  - { nombre: PNV, canal: UCMv59ay_eYWNTNPLpFJSBYw }
  - { nombre: BNG, canal: UClwhV8zFxorQ6jFnYWIG1dg }
  - { nombre: Coalición Canaria, canal: UCxwJkU4G-17XQZ97rcB6u5g }

# Filtro de alcance. Además de estos, cuentan los nombres de src/content/perfil/*.yaml.
