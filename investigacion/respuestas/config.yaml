  - { usuario: PSOE, etiqueta: PSOE }
  - { usuario: sanchezcastejon, etiqueta: Pedro Sánchez }
  - { usuario: felixbolanos, etiqueta: Félix Bolaños }
  - { usuario: DianaMorant, etiqueta: Diana Morant }
