# Temas: un caso solo se propone para un tuit si comparten al menos un tema. Las palabras clave se buscan
# sin tildes ni mayúsculas, al principio de palabra («pension» vale para «pensiones»); pueden ser frases.
# Nada genérico de campaña («derecho», «público», «educación», «elecciones»): eso es lo que mete ruido.
# Al publicar un caso de un tema nuevo, añade aquí una línea; `npm run respuestas -- temas` lista los
# casos que se quedan sin tema.
temas:
  pensiones: [pension, hucha de las pensiones, fondo de reserva, revaloriz, jubilac]
  vivienda: [vivienda, alquiler, okupa, desahucio, expropi, inquilin]
