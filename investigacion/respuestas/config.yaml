# Respuestas en X (skill /respuestas, scripts/respuestas.mjs): cuentas que se leen y etiqueta de los
# casos que les corresponde (el nombre tal como va en `tags`).
# Cuentas: personas con perfil (src/content/perfil) que siguen en política y los partidos del alcance, con el
# usuario de Wikidata (P2002), comprobado el 24-11-2026; en x.com se confirmaron PSOE, sanchezcastejon, mjmonteroc,
# jmalbares, isabelrguez, Pilar_Alegria, patxilopez, felixbolanosg, DianaMorantR, SaizElma, _anaredondo_ (no está
# en Wikidata) y coalicion (tampoco). Fuera por decisión del usuario (24-11-2026): Ábalos y Cerdán, y quienes ya no
# están en política (Calviño, Celaá, Campo, Carmen Calvo, Iceta, Raquel Sánchez, Pablo Iglesias, Errejón). Sin
# cuenta: Grande-Marlaska (@MarlaskaGrande es de un particular), Griñán, Dolores Delgado (@LolaDelgadoG, cerrada),
# Frente Amplio (@frenteamplioesp no es oficial: 0 posts) y Unidas Podemos (ya no existe). Al crear un perfil de
# persona o partido, añade aquí su cuenta.
# Federaciones del PSOE (24-11-2026), con la etiqueta PSOE: Wikidata solo da SocialistesVal, PSOE_CyL y psoeex; el
# resto, comprobadas en x.com. Fuera: psoedeandalucia, psoe_m y PSOE_CyL (bloqueadas en la cuenta del usuario: ni
# se le puede responder ni salen en la búsqueda), Castilla-La Mancha (@PSOE_CLM no existe; @psoeclm no se ve
# oficial) y Galicia (@psdegpsoe no existe). @psoearagon es de otro partido: la del PSOE de Aragón es @aragonpsoe.
