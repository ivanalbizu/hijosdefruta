# casos que les corresponde (el nombre tal como va en `tags`).
# Comprobadas en x.com el 23-11-2026 (salieron tuits suyos): PSOE, sanchezcastejon, mjmonteroc, jmalbares,
# isabelrguez, Pilar_Alegria y patxilopez. El resto se escribió de memoria y no tuiteó en la ventana: sin confirmar.
