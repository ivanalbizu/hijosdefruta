backend:
  name: git-gateway
  branch: main

locale: es
media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "casos"
    label: "Casos"
    label_singular: "Caso"
    folder: "src/content/casos"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    summary: "{{title}}"
    preview_path: "casos/{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text", hint: "Resume el antes y el después (mínimo 20 caracteres)" }
      - label: "Tipo"
        name: "tipo"
        widget: "select"
        options:
          - { label: "Falsedad", value: "falsedad" }
          - { label: "Promesa incumplida", value: "promesa-incumplida" }
          - { label: "Cambio de postura", value: "cambio-de-postura" }
          - { label: "Doble rasero", value: "doble-rasero" }
      - { label: "Fecha de publicación", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Revisado el", name: "revisado", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, hint: "Última vez que se comprobaron citas, fechas y enlaces" }
      - { label: "Destacada en la portada", name: "featured", widget: "boolean", default: false }
      - { label: "Borrador (no se publica)", name: "draft", widget: "boolean", default: true }
      - { label: "Tags (políticos y partidos)", name: "tags", widget: "list" }
      # Campos de un hito; se reutilizan en «Después» y «Cronología» con *hito_fields.
      # Deben coincidir con src/content/config.ts: si falta algo, el build falla.
      - label: "Antes"
        name: "antes"
        widget: "object"
        fields: &hito_fields
          - label: "Fecha"
            name: "fecha"
            widget: "string"
            pattern: ['^\d{4}(-\d{2}(-\d{2})?)?$', "Usa AAAA-MM-DD; si no se conoce el día, AAAA-MM; si tampoco el mes, AAAA"]
          - { label: "Quién", name: "quien", widget: "string", hint: "Nombre y cargo en ese momento" }
          - { label: "Cita literal", name: "cita", widget: "text", required: false, hint: "Palabras exactas, sin comillas. Rellena esto o «Hecho»." }
          - { label: "Hecho", name: "hecho", widget: "text", required: false, hint: "Lo que ocurrió, si no es una declaración" }
          - { label: "Destacado para la imagen", name: "destacado", widget: "string", required: false, hint: "Opcional. Trozos literales de la cita (o del hecho) unidos con [...]; se muestra en la imagen para redes" }
          - { label: "Contexto", name: "contexto", widget: "string", hint: "Dónde y en qué situación: «Pleno del Congreso», «Entrevista en RNE»…" }
          - label: "Fuente"
            name: "fuente"
            widget: "object"
            fields:
              - { label: "URL", name: "url", widget: "string", pattern: ['^https?://', "Debe ser una URL"] }
              - { label: "Medio", name: "medio", widget: "string", hint: "Diario de Sesiones, La Moncloa, BOE, agencia o periódico" }
              - { label: "Copia archivada", name: "archivo", widget: "string", required: false, hint: "Enlace de web.archive.org o archive.today" }
          - label: "Vídeo de YouTube"
            name: "video"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "ID", name: "id", widget: "string", pattern: ['^[\w-]{11}$', "Los 11 caracteres tras watch?v="] }
              - { label: "Título", name: "titulo", widget: "string", required: false }
              - { label: "Empieza en (segundos)", name: "start", widget: "number", value_type: "int", required: false }
              - { label: "Termina en (segundos)", name: "end", widget: "number", value_type: "int", required: false }
          - label: "Documento oficial (recorte)"
            name: "documento"
            widget: "object"
            required: false
            collapsed: true
            hint: "Solo PDF de organismos oficiales (BOE, Diario de Sesiones, La Moncloa…) o documentos públicos de partidos (programas, ponencias), nunca prensa. Tras guardar, ejecuta npm run capturas -- <slug>"
            fields:
              - { label: "URL del PDF", name: "url", widget: "string", required: false, pattern: ['^https?://', "Debe ser una URL"] }
              - { label: "Texto a resaltar", name: "buscar", widget: "list", required: false, hint: "Fragmentos literales del PDF; si se deja vacío, se usa la cita" }
              - { label: "Texto de contexto (sin resaltar)", name: "incluir", widget: "list", required: false }
              - { label: "Imagen (la genera el script)", name: "imagen", widget: "string", required: false }
              - { label: "Página (la rellena el script)", name: "pagina", widget: "number", value_type: "int", required: false }
              - { label: "SHA-256 (lo rellena el script)", name: "sha256", widget: "string", required: false }
      - { label: "Después", name: "despues", widget: "object", fields: *hito_fields }
      - { label: "Cronología", name: "cronologia", widget: "list", required: false, summary: "{{fields.fecha}} · {{fields.quien}}", fields: *hito_fields }
      - { label: "Comentario", name: "body", widget: "markdown", required: false, hint: "Matices o contexto adicional (opcional)" }
