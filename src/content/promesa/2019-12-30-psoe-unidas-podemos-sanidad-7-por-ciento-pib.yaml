fecha: 2019-12-30
quien: PSOE y Unidas Podemos (acuerdo de Gobierno de coalición)
partido: PSOE
compromiso: 'Aumentar los recursos del Sistema Nacional de Salud hasta que el gasto sanitario público llegue al 7 % del PIB en 2023.'
cita: 'En el marco del Consejo Interterritorial de Salud, incrementaremos los recursos destinados al Sistema Nacional de Salud, alcanzando una inversión en servicios públicos propia de otros Estados de la zona euro durante la legislatura, hasta lograr el 7% del PIB en 2023'
contexto: '«Coalición progresista. Un nuevo acuerdo para España», firmado por Pedro Sánchez y Pablo Iglesias antes de la investidura de enero de 2020, punto 2.2.4. Según la Estadística de Gasto Sanitario Público del Ministerio de Sanidad, el gasto público fue del 7,4 % del PIB en 2020 y del 7,1 % en 2021, años de pandemia y de caída del PIB; en 2023 fue del 6,5 % (97 632 millones) y en 2024, del 6,4 %. Las comunidades autónomas hacen el 93,6 % de ese gasto'
tema: Sanidad
campana: Acuerdo de coalición para la investidura de enero de 2020
