fecha: 2023-07-07
quien: PSOE (programa electoral)
partido: PSOE
compromiso: 'Aprobar una ley de lobbies, con un registro público y gratuito de las actividades de los grupos de interés.'
cita: 'Aprobaremos la Ley de Lobbies para dar transparencia a las actividades de los grupos de interés, creando un registro público y gratuito que permita monitorizar las actividades de influencia que se ejercen sobre el personal empleado público'
contexto: 'Programa para las generales del 23 de julio de 2023. El Gobierno llevó al Congreso un proyecto de ley de grupos de interés (Boletín de las Cortes del 7 de febrero de 2025) y en agosto de 2026 aprobó el Real Decreto-ley 21/2026, que el Congreso derogó el 16 de septiembre. Al terminar la legislatura no hay ley'
